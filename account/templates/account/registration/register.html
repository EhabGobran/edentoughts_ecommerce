{% include 'store/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<body>
    <style>

    body{
        background-color: gray;
        }

    </style>

    <br>
    <div class="container bg-white shadow-md p-5 form_layout">

        <h3> Create your account </h3>
        
        <br> <br>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            
            {{form|crispy}}

            <button type="submit" class="btn btn-secondary btn-success">  &nbsp; Create account</button>
        </form>
        <br> <br>
    </div>
    <br> <br>

</body>

{% endblock %}
