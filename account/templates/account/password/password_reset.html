{% include 'store/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>

    body{
        background-color: gray;
        }

</style>
<div class="container bg-white shadow-md p-5 form_layout">
    <h3>Password reset</h3>
    <p>Forgoten your password? type in email in order to email the instructions for reseting your password</p>

    <form method="POST">
        {% csrf_token %}
        {{form|crispy}} <br>
        <button type="submit" class="btn btn-primary">send email</button>
    </form>
</div>
{% endblock %}
