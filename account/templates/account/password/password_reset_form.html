{% include 'store/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>

    body{
        background-color: gray;
        }

</style>
<div class="container bg-white shadow-md p-5 form_layout">
    <p>please type your new password twice to confirm</p>
    <form method="POST">
        {% csrf_token %}
        {{form|crispy}} <br>
        <button type="submit" class="btn btn-primary">set password</button>
    </form>
</div>

{% endblock  %}
