{% include 'store/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<body>
    <style>

    body{
        background-color: gray;
        }

    </style>

    <br>
    <div class="container bg-white shadow-md p-5 form_layout">

        <h3> Login to your account </h3>
        
        <br> <br>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            
            {{form.username|as_crispy_field}}
            <br>
            {{form.password|as_crispy_field}}

            <br>
            <button type="submit" class="btn btn-secondary btn-success">  &nbsp; Login</button>
        </form>
        
        {{form.non_field_errors}}
        <a href="{% url 'reset_password'%}">Forgoten your password ?</a>
        <a href="{% url 'register' %}">Sign up</a>
        <br> <br>
    </div>
    <br> <br>

</body>

{% endblock %}
