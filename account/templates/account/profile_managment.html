{% include 'store/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<body>
    <style>

    body{
        background-color: gray;
        }

    </style>

    <br>
    <div class="container bg-white shadow-md p-5 form_layout">

        <h3> Update your profile </h3>
        
        <br> <br>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            
            {{form.username|as_crispy_field}}
            <br>
            {{form.email|as_crispy_field}}
            <br>

            <button type="submit" class="btn btn-secondary btn-success">  &nbsp; Update</button>
        </form>
        <br> 
    </div>
    <br> 

</body>

{% endblock %}
